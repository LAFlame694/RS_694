{% extends 'dashboard/base_dashboard.html' %}

{% load static %}

{% block title %}Tenants{% endblock %}

{% block extra_css %}
<!-- Custom CSS for Tenant List -->
<link rel="stylesheet" href="{% static 'tenants/css/tenant_list.css' %}">
{% endblock %}

{% block content %}
<div class="container">
    <!-- 1. HEADER SECTION -->
    <div class="row align-items-center mb-4">
    <div class="col-md-8">
        <h1 class="h3 fw-bold mb-1">Tenants</h1>
        <p class="text-muted mb-0">Manage all tenants in the system</p>
    </div>
    <div class="col-md-4 text-md-end mt-3 mt-md-0">
        <a href="{% url 'add_tenant' %}" class="btn btn-primary d-inline-flex align-items-center">
        <i
            data-lucide="plus"
            class="me-2"
            style="width: 18px; height: 18px"
        ></i>
        Add Tenant
        </a>
    </div>
    </div>

    <!-- 2. SEARCH & FILTER BAR -->
    <div class="row g-3 mb-4">
    <div class="col-md-9">
        <div class="input-group">
        <span class="input-group-text bg-white border-end-0">
            <i
            data-lucide="search"
            class="text-muted"
            style="width: 18px; height: 18px"
            ></i>
        </span>
        <input
            type="text"
            name="q"
            class="form-control border-start-0 ps-0"
            placeholder="Search by name or phone..."

            hx-get="{% url 'tenant_list' %}"
            hx-trigger="keyup changed delay:500ms"
            hx-target="#tenant-list-container"
            hx-swap="innerHTML"
            hx-include="[name='status']"
        />
        </div>
    </div>
    <div class="col-md-3">
        <select 
        class="form-select"
        name="status"

        hx-get="{% url 'tenant_list' %}"
        hx-trigger="change"
        hx-target="#tenant-list-container"
        hx-swap="innerHTML"
        hx-include="[name='q']"
        >
            <option value="" selected>All Tenants</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
        </select>
    </div>
    </div>

    <!-- 3. TENANT TABLE SECTION -->
    <div class="card overflow-hidden" id="tenant-list-container">
        {% include "tenants/partials/tenant_table_rows.html" %}
    </div>
</div>
{% endblock %}
